name: Dependabot skip labels (on GH action updates)

# Adds the 'skip-doc' label to Dependabot github-actions PRs that do not touch
# ci_cd.yml, the only workflow that builds the docs on pull requests.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-labels:
    name: "Apply skip-doc label for irrelevant action updates"
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/github_actions/')
    permissions:
      pull-requests: write   # Required to add labels to the Dependabot PR

    steps:
      - name: Apply skip-doc label based on changed files
        env:
          GH_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          changed=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files --jq '.files[].path')
          echo "Changed files:"
          echo "$changed"

          if ! echo "$changed" | grep -qx ".github/workflows/ci_cd.yml"; then
            echo "ci_cd.yml not modified — adding skip-doc"
            gh pr edit "$PR_URL" --add-label "skip-doc"
          fi
