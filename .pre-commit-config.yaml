repos:

- repo: https://github.com/psf/black-pre-commit-mirror
  rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
  hooks:
  - id: black
    args: ["doc/source/conf.py"]

- repo: https://github.com/adamchainz/blacken-docs
  rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # frozen: 1.20.0
  hooks:
  - id: blacken-docs
    additional_dependencies: [black==23.10.1]

- repo: https://github.com/pycqa/isort
  rev: 5d9c96196def28a1819b6a755a669ec0a3add6aa  # frozen: 10.0.0b2
  hooks:
  - id: isort
    args: [
      "--profile", "black",
      "--force-sort-within-sections",
      "--line-length", "100",
    ]

- repo: https://github.com/PyCQA/flake8
  rev: 960c1d286190804104f7255b97da034446fdaac3  # frozen: 7.5.0
  hooks:
  - id: flake8

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
  - id: trailing-whitespace

- repo: https://github.com/ansys/pre-commit-hooks
  rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
  hooks:
  - id: add-license-headers
    args:
    - --start_year=2023